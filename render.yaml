services:
  - type: web
    name: guardian-of-light
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn guardian_core.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: src
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
