[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardian-core"
version = "0.5.0-dev.1"
description = "Core reasoning engines for Guardian of Light"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openai>=1.68,<3",
  "pyyaml>=6.0,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
