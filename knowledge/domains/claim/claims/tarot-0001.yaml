data:
  statement: >
    Across common tarot tradition, The Fool (card 0) is read as boundless
    potential and the start of a journey, not as foolishness in the
    pejorative sense -- the everyday word "fool" is a false-friend reading
    of the card.
  claim_type: traditional
  confidence: medium
  disputed: false
  evidence_note: >
    Widely repeated across popular tarot literature; not sourced here to
    one specific citable text.
