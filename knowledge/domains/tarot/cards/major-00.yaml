data:
  arcana: major
  name_he: השוטה
  core_essence: >
    עמידה על סף הידוע, כשכל מה שנדרש לצעד הבא כבר נמצא בידיים, גם אם
    עדיין לא ברור מה בדיוק הצעד הזה דורש.
  light_expression: >
    אמון בתהליך, פתיחות אמיתית לחוויה, ואומץ להתחיל גם בלי תוצאה מובטחת.
  shadow_expression: >
    פזיזות, סירוב לתכנן, בלבול בין תמימות לאמונה, והתעלמות מסיכון אמיתי
    וגלוי לעין.
  reversed_expression: >
    היסוס שמתחפש לזהירות, התחלה אמיתית שנדחית הרבה מעבר לנקודה שבה היא
    הייתה אי פעם מרגישה בטוחה לגמרי -- או ההפך: קפיצה בלי שום עיגון.
  dimensions:
    emotional: תחושת פתיחות שעדיין לא נבחנה מול תוצאה אמיתית.
    mental: חשיבה במונחים של אפשרות ולא של תוכנית.
    relational: כניסה לקשר או למצב בלי תסריט קבוע מראש לאיך זה אמור להתנהל.
    practical: צעד ראשון ומוחשי -- נסיעה, עבודה, פרויקט -- שנעשה לפני שכל משתנה נשלט.
    spiritual: נכונות להשתנות דרך מה שעדיין לא קרה.
  contexts:
    love: כניסה למשהו חדש בלי לדרוש ודאות לגבי איך זה ייגמר.
    work: התחלת תפקיד, פרויקט או כיוון לפני שכל סיכון ממופה במלואו.
    money: החלטה כספית שמתקבלת מתוך אמון מנומק ולא מתוך מידע מלא.
    decision: האפשרות שדורשת אומץ יותר מאשר ניתוח.
    growth: הצעד שאפשר להבין רק על ידי עשייתו.
  reflection_questions:
    - "מה היית עושה כאן אם היית בוטחת שתוכלי להתמודד עם מה שיבוא אחר כך?"
    - "האם ההיסוס שלך מגן עלייך מסיכון אמיתי, או רק מתחושת אי-ודאות?"
  grounded_actions:
    - "הגדירי גרסה קטנה והפיכה של הקפיצה שאת שוקלת, וקחי רק אותה."
    - "כתבי את פרט המידע האחד שבאמת היית צריכה כדי שזה יפסיק להרגיש כמו קפיצה עיוורת."
  safety_notes: >
    Guardian לא צריך לקרוא את הקלף הזה כהיתר להתעלם מסיכון אמיתי ומוחשי
    (כלכלי, פיזי, או בטיחות בתוך קשר) -- פתיחות להתחלה אינה זהה להמלצה
    על קפיצה לא נבחנת.
