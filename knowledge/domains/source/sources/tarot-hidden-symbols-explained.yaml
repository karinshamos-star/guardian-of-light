  notes: >
    sha256: 927aa9d61281555ea79fded95b75a3ec7115f17f36a53cb50e857ac619ffe07

    3478 pages (Kindle pagination), 241 PDF pages — each PDF page a
    full-page screenshot image (3024x1964), no text layer, no OCR.
    Confirmed via sampled pages (cover, p.61): a page-by-page Kindle-app
    screenshot capture of a real, commercially published book — "Tarot
    Cards: The Hidden Symbols Explained" by Derek Johnsen. Cover
    reproduces recognizable Rider-Waite-Smith card art (same tradition as
    the rest of the library).

    CONTENT/STRUCTURE (from sampled pages): organized by *symbol*, not by
    card — e.g. "Throne: symbolises stability... Symbol found in some of
    these cards: The Empress, The Emperor, Justice, Queen/King of Swords,
    Cups, Coins, Wands"; "Tomb: symbolises freeing yourself... found in:
    Judgement, Four of Swords"; "Tools: symbolises reshaping your life...".
    Each symbol gets a one-line meaning plus a cross-reference list of
    every card it appears on. This is a distinct and genuinely useful
    angle from the other two new registrations: it lets a specific visual
    element's meaning be checked for consistency *across* every card it
    appears in, rather than describing one card's imagery in isolation.

    LAYER FIT: strong, distinctively-shaped fit for Symbolic Language
    (Layer 2) — arguably better suited to building a consistent symbol
    vocabulary across the deck than a card-by-card imagery description
    would be, though it would need re-organizing (symbol-to-card) into
    (card-to-symbols) to actually populate a given card's synthesis
    document.

    LICENSING — same category of concern as the other two new
    registrations this scan: a screen-captured copy of a real,
    identifiable, apparently currently-in-print retail book, not an
    ambiguous PDF. Do not treat as cleared for use or proceed to
    extraction/synthesis without confirming actual usage rights. Should
    not advance past draft/needs_review until resolved.
